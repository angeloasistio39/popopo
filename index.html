<!DOCTYPE html>
<html>
<head>
    <title>Film Spectrum</title>
    <style>
        body {
            background-color: #000000;
        }
        h1 {
            color: rgb(256, 0, 0);
        }
        p {
            color: rgb(126, 161, 39);
        }
    </style>
</head>
<body>
    <h1>Films are colors</h1>

    <p>to something deeper than entertainment alone.</p>
